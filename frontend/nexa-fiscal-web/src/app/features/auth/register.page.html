<div class="auth-page">
  <section class="auth-brand-panel">
    <div class="auth-brand">
      <span class="brand-mark">N</span>
      <div>
        <strong>Nexa Fiscal</strong>
        <span>Gestão clara. Faturamento confiável.</span>
      </div>
    </div>
    <div class="auth-brand-copy">
      <span class="eyebrow">Primeiro acesso</span>
      <h1>Comece com uma base simples e segura.</h1>
      <p>Crie sua conta para acessar o ambiente do Nexa Fiscal.</p>
    </div>
  </section>

  <main class="auth-form-panel">
    <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
      <div class="auth-card-header">
        <span class="eyebrow">Nexa Fiscal</span>
        <h2>Criar conta</h2>
        <p>Preencha seus dados para começar.</p>
      </div>

      @if (errorMessage) {
        <div class="alert alert-error">{{ errorMessage }}</div>
      }

      <label class="field">
        <span>Nome</span>
        <input type="text" formControlName="name" autocomplete="name" placeholder="Seu nome" />
        @if (form.controls.name.touched && form.controls.name.invalid) {
          <small class="field-error">Informe ao menos 2 caracteres.</small>
        }
      </label>

      <label class="field">
        <span>E-mail</span>
        <input type="email" formControlName="email" autocomplete="email" placeholder="voce@empresa.com" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="field-error">Informe um e-mail válido.</small>
        }
      </label>

      <label class="field">
        <span>Senha</span>
        <input type="password" formControlName="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="field-error">A senha deve possuir ao menos 8 caracteres.</small>
        }
      </label>

      <label class="field">
        <span>Confirmar senha</span>
        <input type="password" formControlName="confirmPassword" autocomplete="new-password" placeholder="Repita sua senha" />
      </label>

      <button class="btn btn-primary btn-block" type="submit" [disabled]="loading">
        {{ loading ? 'Criando conta...' : 'Criar conta' }}
      </button>

      <p class="auth-switch">Já possui uma conta? <a routerLink="/login">Entrar</a></p>
    </form>
  </main>
</div>
