<aside class="sidebar">
  <a class="brand" routerLink="/" aria-label="Nexa Fiscal - início">
    <span class="brand-mark">N</span>
    <span>
      <strong>Nexa</strong>
      <small>Fiscal</small>
    </span>
  </a>

  <nav class="nav-list" aria-label="Navegação principal">
    <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="active">
      <span class="nav-icon">▦</span>
      Dashboard
    </a>
    <a routerLink="/products" routerLinkActive="active">
      <span class="nav-icon">□</span>
      Produtos
    </a>
    <a routerLink="/invoices" routerLinkActive="active">
      <span class="nav-icon">▤</span>
      Notas Fiscais
    </a>
  </nav>

  @if (auth.user(); as user) {
    <div class="sidebar-user">
      <div class="sidebar-user-avatar">{{ user.name.charAt(0).toUpperCase() }}</div>
      <div class="sidebar-user-copy">
        <strong>{{ user.name }}</strong>
        <small>{{ user.email }}</small>
      </div>
      <button type="button" class="sidebar-logout" (click)="logout()" aria-label="Sair">↪</button>
    </div>
  }
</aside>
